services:
  - type: web
    name: tequis-delivery-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production

  - type: web
    name: tequis-web
    env: static
    rootDir: public_website
    buildCommand: echo ready
    staticPublishPath: .
